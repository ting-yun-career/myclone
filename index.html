<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Avatar</title>
<style>
  :root {
    --bg: #0d1016; --panel: #151a23; --line: #232b38; --text: #e8ecf3; --muted: #8b95a7;
    --accent: #6ea8ff; --listen: #4ade80; --think: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #1b2332 0%, var(--bg) 60%);
    color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: 1fr auto; height: 100dvh;
  }
  #stageWrap { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #view { position: relative; min-height: 0; }
  #stage { width: 100%; height: 100%; display: block; }

  #pill {
    position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px; background: rgba(21,26,35,.78);
    border: 1px solid var(--line); backdrop-filter: blur(8px); font-size: 13px; max-width: calc(100% - 28px);
  }
  #pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  #pill[data-state="listening"] .dot { background: var(--listen); box-shadow: 0 0 0 4px rgba(74,222,128,.2); }
  #pill[data-state="thinking"] .dot { background: var(--think); animation: pulse 1s infinite; }
  #pill[data-state="happy"] .dot { background: var(--accent); }
  #pill[data-state="error"] .dot { background: var(--err); }
  #pillText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes pulse { 50% { opacity: .35; } }

  #user {
    position: absolute; top: 62px; left: 14px; width: min(360px, calc(100% - 28px));
    max-height: calc(100% - 76px); display: flex; flex-direction: column; gap: 8px;
  }
  #said, #caption {
    padding: 8px 12px; border-radius: 12px; background: rgba(21,26,35,.78); border: 1px solid var(--line);
    backdrop-filter: blur(8px); font: 500 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
  }
  #said { margin: 0; overflow-y: auto; overflow-wrap: anywhere; max-height: 9em; }
  #said:empty { display: none; }
  #caption { width: 100%; overflow: hidden; field-sizing: content; resize: none; }
  #caption::placeholder { color: var(--muted); }
  #caption:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #reply {
    position: absolute; left: 50%; top: 81%; transform: translateX(-50%);
    width: min(680px, calc(100% - 28px)); max-height: 17%; overflow: hidden; text-align: center;
    font-size: clamp(17px, 2.2vw, 20px); font-weight: 500;
  }
  #reply .word { animation: wordin .18s ease-out; }
  @keyframes wordin { from { opacity: 0; } }
  #said.fade { animation: capin .35s ease-out; }
  @keyframes capin { from { opacity: 0; transform: translateY(6px); } }

  #status {
    position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 2px;
    padding: 8px 12px; border-radius: 12px; background: rgba(21,26,35,.78); border: 1px solid var(--line);
    backdrop-filter: blur(8px); font-size: 13px; max-width: min(260px, calc(100% - 28px));
  }
  #status strong { font-weight: 600; color: var(--listen); }
  #status[data-sleeping] strong { color: var(--think); }
  #status span { color: var(--muted); }
  #status span[hidden] { display: none; }

</style>
</head>
<body>
  <div id="stageWrap">
    <div id="view">
      <canvas id="stage"></canvas>
      <div id="pill" data-state="loading"><span class="dot"></span><span id="pillText">Loading character…</span></div>
      <aside id="status" aria-live="polite">
        <strong id="statusMain">Status: Awake</strong>
        <span id="statusVoice"></span>
        <span id="statusNeurons"></span>
        <span id="statusSound" hidden>Sound: click page to enable</span>
      </aside>
      <div id="user">
        <p id="said" aria-live="polite"></p>
        <textarea id="caption" rows="1" maxlength="2000" placeholder="Say something..." aria-label="Your message. Type here or speak. Press Enter to send."></textarea>
      </div>
      <div id="reply" aria-live="polite"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
